services:
  offloading-manager:
    build: .
    container_name: offloading-manager
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - project-emerge-network
    environment:
      - DOCKER_NETWORK=project-emerge-network
      - MONITOR_INTERVAL=5.0
      - STRESS_THRESHOLD=80.0
      - ROBOT_TIMEOUT=10.0
    restart: unless-stopped

networks:
  project-emerge-network:
    external: true